<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>便签墙</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background-image: linear-gradient(0deg, #eee 1px, transparent 0),
          linear-gradient(90deg, #eee 1px, transparent 0);
        background-size: 30px 30px;
        color: #333;
        min-height: 100dvh;
        overflow: hidden;
      }

      body.has-maximized-card {
        overflow: hidden;
      }

      body.is-mobile {
        overflow-y: auto;
      }

      #board {
        position: relative;
        width: 100vw;
        height: 100dvh;
        overflow: hidden;
      }

      body.is-mobile #board {
        height: auto;
        min-height: 100dvh;
      }

      .card {
        position: absolute;
        width: 220px;
        border-radius: 12px;
        box-shadow: 0 16px 35px rgba(0, 0, 0, 0.2);
        background: #fff;
        border: 1px solid rgba(0, 0, 0, 0.08);
        overflow: hidden;
        opacity: 0;
        transform-origin: center;
        transition: transform 0.35s ease, opacity 0.35s ease, left 0.35s ease,
          top 0.35s ease, width 0.35s ease, height 0.35s ease,
          border-radius 0.35s ease;
      }

      .card.dragging {
        transition: none;
        box-shadow: 0 22px 45px rgba(0, 0, 0, 0.35);
      }

      .card.maximized {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        border-radius: 0;
        box-shadow: 0 28px 60px rgba(0, 0, 0, 0.4);
      }

      .card-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 12px;
        background: rgba(255, 255, 255, 0.7);
        cursor: grab;
        user-select: none;
        touch-action: pan-y;
      }

      .card-header.dragging {
        cursor: grabbing;
      }

      .window-controls {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .window-controls .control {
        position: relative;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        border: 1px solid rgba(0, 0, 0, 0.08);
        background: #ccc;
        cursor: pointer;
        outline: none;
        padding: 0;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      .window-controls .control.close {
        background: #ff5f57;
        border-color: #e0443e;
      }

      .window-controls .control.minimize {
        background: #febb2e;
        border-color: #dea123;
      }

      .window-controls .control.maximize {
        background: #28c840;
        border-color: #1aab2c;
      }

      .window-controls .control::after {
        content: "";
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        opacity: 0;
        transition: opacity 0.2s ease;
      }

      .card-header:hover .window-controls .control::after {
        opacity: 0.8;
      }

      .window-controls .control.close::after {
        content: "×";
        width: auto;
        height: auto;
        background: none;
        font-size: 10px;
        line-height: 1;
        font-weight: 700;
        color: rgba(0, 0, 0, 0.7);
      }

      .window-controls .control.minimize::after {
        width: 6px;
        height: 2px;
        background: rgba(0, 0, 0, 0.6);
      }

      .window-controls .control.maximize::after {
        width: 6px;
        height: 6px;
        background: linear-gradient(
          45deg,
          rgba(0, 0, 0, 0.6) 0%,
          rgba(0, 0, 0, 0.6) 45%,
          transparent 45%,
          transparent 55%,
          rgba(0, 0, 0, 0.6) 55%,
          rgba(0, 0, 0, 0.6) 100%
        );
      }

      .card-title {
        font-size: 13px;
        font-weight: 600;
        color: rgba(0, 0, 0, 0.55);
        padding-left: 10px;
        flex: 1;
      }

      .card-body {
        padding: 16px;
        font-size: 16px;
        line-height: 1.4;
        font-weight: 600;
        color: rgba(0, 0, 0, 0.72);
        word-break: break-word;
        overflow-wrap: anywhere;
        white-space: normal;
      }

      .card.maximized {
        display: flex;
        flex-direction: column;
      }

      .card.maximized .card-title {
        display: none;
      }

      .card.maximized .card-body {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        text-align: center;
        padding: clamp(32px, min(10vw, 10vh), 128px);
        padding-top: clamp(72px, min(14vw, 14vh), 192px);
        font-size: clamp(48px, min(18vw, 18vh), 200px);
        line-height: 1.05;
      }

      @media (max-width: 768px) {
        .card {
          width: 180px;
          border-radius: 10px;
        }

        .card-body {
          padding: 14px;
          font-size: 14px;
        }

        .card-title {
          font-size: 12px;
        }
      }
    </style>
  </head>
  <body>
    <div id="board"></div>

    <script>
      const board = document.getElementById("board");
      const messages = [
        "保持好心情",
        "多喝水哦",
        "今天辛苦啦",
        "早点休息",
        "记得吃水果",
        "加油，你可以的",
        "祝你顺利",
        "保持微笑呀",
        "愿所有烦恼都消失",
        "期待下一次见面",
        "梦想总会实现",
        "天气冷了，多穿衣服",
        "记得给自己放松",
        "每天都要元气满满",
        "今天也要好好爱自己",
        "适当休息一下",
        "记得按时吃饭",
        "适当运动身体好",
        "保护眼睛多休息",
        "不要熬夜太晚",
        "深呼吸，放轻松",
        "烦恼都会过去的",
        "给自己一个拥抱",
        "保持积极心态",
        "相信自己很棒",
        "每一步都是进步",
        "坚持就是胜利",
        "勇敢面对挑战",
        "注意安全哦",
        "整理一下心情",
        "享受当下时光",
        "发现生活中的小美好",
        "朋友是温暖的阳光",
        "分享你的快乐",
      ];

      const colors = [
        "#ffe0e3",
        "#c7f0ff",
        "#ffd8a8",
        "#d9f2d9",
        "#e5d7ff",
        "#f9f7d9",
        "#d2f0f8",
        "#ffd4f5",
      ];

      const cardStates = new WeakMap();
      // Reserve a very high层级给全屏卡片，避免被后续元素覆盖
      const MAXIMIZED_LAYER = 1000000;
      let activeMaximizedCard = null;
      const pointerMediaQuery = window.matchMedia("(pointer: coarse)");
      let isMobile = pointerMediaQuery.matches || window.innerWidth <= 768;
      let maxCards = isMobile ? 150 : 220; // 限制 DOM 节点数量，减轻移动端压力
      const initialCardCount = isMobile ? 25 : 40;
      let spawnInterval = isMobile ? 350 : 200;
      let zIndexCursor = 200;
      let spawnTimer = null;

      // 生日惊喜相关变量
      let cardCounter = 0; // 计数器，记录生成的卡片总数
      const BIRTHDAY_TRIGGER_COUNT = 50; // 触发生日惊喜的卡片数量
      let birthdayTriggered = false; // 是否已触发生日惊喜

      document.body.classList.toggle("is-mobile", isMobile);

      function randomFrom(array) {
        return array[Math.floor(Math.random() * array.length)];
      }

      function clamp(value, min, max) {
        return Math.min(Math.max(value, min), max);
      }

      function applyTransform(card, state) {
        const scale = state.scale ?? 1;
        const angle = state.angle ?? 0;
        card.style.transform = `scale(${scale}) rotate(${angle}deg)`;
      }

      function bringToFront(card) {
        if (card === activeMaximizedCard) {
          card.style.zIndex = MAXIMIZED_LAYER;
          return;
        }

        zIndexCursor += 1;
        if (activeMaximizedCard && zIndexCursor >= MAXIMIZED_LAYER) {
          zIndexCursor = MAXIMIZED_LAYER - 1;
        }

        card.style.zIndex = zIndexCursor;
      }

      function updateBodyMaximizedState() {
        document.body.classList.toggle(
          "has-maximized-card",
          Boolean(activeMaximizedCard)
        );
      }

      function scheduleNextSpawn() {
        clearTimeout(spawnTimer);
        spawnTimer = setTimeout(() => {
          if (!document.hidden) {
            createCard();
          }
          scheduleNextSpawn();
        }, spawnInterval);
      }

      function syncMobileMode() {
        const nextIsMobile =
          pointerMediaQuery.matches || window.innerWidth <= 768;
        if (nextIsMobile === isMobile) return;

        isMobile = nextIsMobile;
        maxCards = isMobile ? 150 : 220;
        spawnInterval = isMobile ? 350 : 200;
        document.body.classList.toggle("is-mobile", isMobile);
        scheduleNextSpawn();
      }

      function handleBoardClick(event) {
        const control = event.target.closest(".control");
        if (!control) return;

        const card = control.closest(".card");
        if (!card || !board.contains(card)) return;

        event.preventDefault();

        if (control.classList.contains("close")) {
          closeCard(card);
        } else if (control.classList.contains("minimize")) {
          minimizeCard(card);
        } else if (control.classList.contains("maximize")) {
          toggleMaximize(card);
        }
      }

      function handleBoardPointerDown(event) {
        const card = event.target.closest(".card");
        if (!card || !board.contains(card)) return;

        const control = event.target.closest(".control");
        const header = event.target.closest(".card-header");
        const pointerType = event.pointerType || "mouse";
        const isPrimaryPointer = event.isPrimary !== false;

        if (header && !control && pointerType !== "touch" && isPrimaryPointer) {
          startDrag(event, card);
          return;
        }

        bringToFront(card);
      }

      function handleBoardDoubleClick(event) {
        const header = event.target.closest(".card-header");
        if (!header || event.target.closest(".control")) return;

        const card = header.closest(".card");
        if (!card || !board.contains(card)) return;

        toggleMaximize(card);
      }

      board.addEventListener("click", handleBoardClick);
      board.addEventListener("pointerdown", handleBoardPointerDown);
      board.addEventListener("dblclick", handleBoardDoubleClick);

      function closeCard(card) {
        const state = cardStates.get(card);
        if (!state || state.closing) return;
        if (card === activeMaximizedCard) {
          activeMaximizedCard = null;
          updateBodyMaximizedState();
        }
        state.closing = true;
        state.scale = 0.1;
        card.style.opacity = "0";
        applyTransform(card, state);

        const handleTransitionEnd = (event) => {
          if (event.propertyName === "opacity") {
            card.removeEventListener("transitionend", handleTransitionEnd);
            card.remove();
          }
        };

        card.addEventListener("transitionend", handleTransitionEnd);
      }

      function minimizeCard(card) {
        const state = cardStates.get(card);
        if (!state || state.closing) return;

        // 最小化动画：缩小并淡出到底部，结束时移除节点释放内存
        const runMinimize = () => {
          state.closing = true;
          bringToFront(card);
          const bottom = Math.max(window.innerHeight - 24, 0);
          const targetLeft = clamp(
            state.left,
            16,
            Math.max(window.innerWidth - card.offsetWidth - 16, 16)
          );

          state.left = targetLeft;
          state.top = bottom;
          state.scale = 0.1;
          state.angle = 0;
          card.style.left = `${targetLeft}px`;
          card.style.top = `${bottom}px`;
          card.style.opacity = "0.35";
          applyTransform(card, state);

          const handleTransitionEnd = (event) => {
            if (event.propertyName === "transform") {
              card.removeEventListener("transitionend", handleTransitionEnd);
              card.remove();
            }
          };

          card.addEventListener("transitionend", handleTransitionEnd);
        };

        if (state.maximized) {
          restoreFromMaximize(card, state);
          requestAnimationFrame(() => {
            requestAnimationFrame(runMinimize);
          });
          return;
        }

        runMinimize();
      }

      function toggleMaximize(card) {
        const state = cardStates.get(card);
        if (!state || state.closing) return;

        if (state.maximized) {
          restoreFromMaximize(card, state);
        } else {
          maximizeCard(card, state);
        }
      }

      function maximizeCard(card, state) {
        if (activeMaximizedCard && activeMaximizedCard !== card) {
          const activeState = cardStates.get(activeMaximizedCard);
          if (activeState) {
            restoreFromMaximize(activeMaximizedCard, activeState);
          }
        }

        state.beforeMaximize = {
          left: state.left,
          top: state.top,
          scale: state.scale ?? 1,
          angle: state.angle ?? 0,
          width: card.offsetWidth,
          height: card.offsetHeight,
          inlinePosition: card.style.position,
        };

        card.classList.add("maximized");
        card.style.position = "fixed";
        card.style.left = "0px";
        card.style.top = "0px";
        card.style.width = "100vw";
        card.style.height = "100dvh";
        card.style.borderRadius = "0";

        state.left = 0;
        state.top = 0;
        state.scale = 1;
        state.angle = 0;
        applyTransform(card, state);
        activeMaximizedCard = card;
        bringToFront(card);
        state.maximized = true;
        updateBodyMaximizedState();
      }

      function restoreFromMaximize(card, state) {
        const previous = state.beforeMaximize;
        if (!previous) return;

        card.classList.remove("maximized");
        card.style.position = previous.inlinePosition || "absolute";
        card.style.left = `${previous.left}px`;
        card.style.top = `${previous.top}px`;
        card.style.width = `${previous.width}px`;
        card.style.height = `${previous.height}px`;
        card.style.borderRadius = "12px";

        state.left = previous.left;
        state.top = previous.top;
        state.scale = previous.scale ?? 1;
        state.angle = previous.angle ?? state.angle ?? 0;
        applyTransform(card, state);
        state.maximized = false;
        if (activeMaximizedCard === card) {
          activeMaximizedCard = null;
          updateBodyMaximizedState();
        }
        bringToFront(card);
        setTimeout(() => {
          if (!state.maximized) {
            card.style.width = "";
            card.style.height = "";
            card.style.borderRadius = "";
            if (previous.inlinePosition) {
              card.style.position = previous.inlinePosition;
            } else {
              card.style.position = "";
            }
            state.beforeMaximize = null;
          }
        }, 360);
      }

      function startDrag(event, card) {
        const control = event.target.closest(".control");
        if (control) return;

        const state = cardStates.get(card);
        if (!state || state.closing || state.maximized) return;

        // 鼠标拖拽使用 rAF 节流，避免频繁触发布局计算
        event.preventDefault();
        bringToFront(card);

        const header = card.querySelector(".card-header");
        card.classList.add("dragging");
        header.classList.add("dragging");

        state.dragging = true;
        state.dragOffsetX = event.clientX - state.left;
        state.dragOffsetY = event.clientY - state.top;

        let dragFrame = null;
        let pendingLeft = state.left;
        let pendingTop = state.top;

        const commitDrag = () => {
          dragFrame = null;
          const maxLeft = Math.max(window.innerWidth - card.offsetWidth, 0);
          const maxTop = Math.max(window.innerHeight - card.offsetHeight, 0);
          state.left = clamp(pendingLeft, -card.offsetWidth * 0.4, maxLeft);
          state.top = clamp(pendingTop, -card.offsetHeight * 0.4, maxTop);
          card.style.left = `${state.left}px`;
          card.style.top = `${state.top}px`;
        };

        const handlePointerMove = (moveEvent) => {
          if (!state.dragging) return;

          pendingLeft = moveEvent.clientX - state.dragOffsetX;
          pendingTop = moveEvent.clientY - state.dragOffsetY;
          if (dragFrame === null) {
            dragFrame = requestAnimationFrame(commitDrag);
          }
        };

        const handlePointerUp = () => {
          state.dragging = false;
          card.classList.remove("dragging");
          header.classList.remove("dragging");
          if (dragFrame !== null) {
            cancelAnimationFrame(dragFrame);
            commitDrag();
          }
          document.removeEventListener("pointermove", handlePointerMove);
          document.removeEventListener("pointerup", handlePointerUp);
        };

        document.addEventListener("pointermove", handlePointerMove);
        document.addEventListener("pointerup", handlePointerUp);
      }

      function createCard() {
        // 如果已经触发了生日惊喜，则不再创建新卡片
        if (birthdayTriggered) {
          return;
        }

        const card = document.createElement("div");
        card.className = "card";

        const color = randomFrom(colors);
        const angleRange = isMobile ? 6 : 10;
        const angle = (Math.random() - 0.5) * angleRange;
        const entryScale = isMobile ? 0.8 : 0.65;
        const cardWidth = isMobile ? 180 : 220;
        const cardHeight = isMobile ? 130 : 140;
        const horizontalMargin = isMobile ? 12 : 16;
        const verticalMargin = isMobile ? 12 : 20;
        const left =
          horizontalMargin +
          Math.random() *
            Math.max(window.innerWidth - cardWidth - horizontalMargin * 2, 0);
        const top =
          verticalMargin +
          Math.random() *
            Math.max(window.innerHeight - cardHeight - verticalMargin * 2, 0);

        card.style.background = color;
        card.style.left = `${left}px`;
        card.style.top = `${top}px`;
        card.style.opacity = "0";
        if (activeMaximizedCard && zIndexCursor >= MAXIMIZED_LAYER - 2) {
          zIndexCursor = MAXIMIZED_LAYER - 2;
        }
        card.style.zIndex = ++zIndexCursor;

        card.innerHTML = `
					<div class="card-header">
						<div class="window-controls">
							<button class="control close" type="button" aria-label="关闭"></button>
							<button class="control minimize" type="button" aria-label="最小化"></button>
							<button class="control maximize" type="button" aria-label="最大化"></button>
						</div>
						<div class="card-title">温馨提示</div>
					</div>
					<div class="card-body">${randomFrom(messages)}</div>
				`;

        const state = {
          angle,
          scale: entryScale,
          left,
          top,
          maximized: false,
          closing: false,
        };

        cardStates.set(card, state);
        applyTransform(card, state);
        board.appendChild(card);

        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            state.scale = 1;
            applyTransform(card, state);
            card.style.opacity = "1";
          });
        });

        // 增加卡片计数器
        cardCounter++;

        // 检查是否达到触发生日惊喜的条件
        if (cardCounter >= BIRTHDAY_TRIGGER_COUNT && !birthdayTriggered) {
          birthdayTriggered = true;
          // 延迟触发，让当前卡片完全显示
          setTimeout(() => {
            triggerBirthdaySurprise();
          }, 1000);
        }

        if (board.children.length > maxCards) {
          const oldest = board.firstElementChild;
          if (oldest && oldest !== card) {
            oldest.remove();
          }
        }
      }

      function triggerBirthdaySurprise() {
        // 清除所有现有的卡片
        const cards = document.querySelectorAll(".card");

        // 为每个卡片添加消失动画
        cards.forEach((card, index) => {
          setTimeout(() => {
            const state = cardStates.get(card);
            if (state) {
              state.closing = true;
              state.scale = 0;
              state.angle = (Math.random() - 0.5) * 30; // 随机旋转
              card.style.opacity = "0";
              applyTransform(card, state);

              // 动画结束后移除卡片
              setTimeout(() => {
                card.remove();
              }, 800);
            }
          }, index * 50); // 依次消失，创造波浪效果
        });

        // 所有卡片消失后显示信封
        setTimeout(() => {
          showEnvelope();
        }, cards.length * 50 + 800);
      }

      function showEnvelope() {
        // 创建信封元素
        const envelope = document.createElement("div");
        envelope.className = "envelope-container";
        envelope.innerHTML = `
          <div class="letter-image">
            <div class="envelope-front-emoji">💌</div>
            <div class="animated-mail">
              <div class="back-fold"></div>
              <div class="letter">
                <div class="letter-border"></div>
                <div class="letter-title"></div>
                <div class="letter-context"></div>
                <div class="letter-stamp">
                  <div class="letter-stamp-inner">💌</div>
                </div>
              </div>
              <div class="top-fold"></div>
              <div class="body"></div>
              <div class="left-fold"></div>
            </div>
            <div class="shadow"></div>
            <div class="envelope-message">点击打开信封</div>
          </div>
        `;

        // 添加信封样式
        const style = document.createElement("style");
        style.textContent = `
          .envelope-container {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10000;
            cursor: pointer;
          }
          
          .letter-image {
            position: relative;
            width: 320px;
            height: 320px;
            cursor: pointer;
            animation: envelopeFloat 3s ease-in-out infinite;
          }
          
          .envelope-front-emoji {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 48px;
            z-index: 5;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.3));
            pointer-events: none;
          }
          
          @keyframes envelopeFloat {
            0%, 100% { transform: translateY(0) rotateZ(0deg); }
            50% { transform: translateY(-15px) rotateZ(1deg); }
          }
          
          .animated-mail {
            position: absolute;
            height: 240px;
            width: 320px;
            transition: 0.4s;
            transform-style: preserve-3d;
            perspective: 1000px;
          }
          
          /* 信封部分 一 */
          .animated-mail .body {
            position: absolute;
            bottom: 0;
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 0 0 160px 320px;
            border-color: transparent transparent #ff6b95 transparent;
            z-index: 2;
            background: linear-gradient(135deg, #ff6b95 0%, #feca57 100%);
          }
          
          .animated-mail .top-fold {
            position: absolute;
            top: 80px;
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 80px 160px 0 160px;
            transform-origin: 50% 0%;
            transition: transform 0.4s 0.4s, z-index 0.2s 0.4s;
            border-color: #ff6b95 transparent transparent transparent;
            z-index: 2;
            background: linear-gradient(135deg, #ff6b95 0%, #feca57 100%);
          }
          
          /* 信封部分 二 */
          .animated-mail .back-fold {
            position: absolute;
            bottom: 0;
            width: 320px;
            height: 160px;
            background: linear-gradient(135deg, #ff6b95 0%, #feca57 100%);

        cakePage.className = "cake-fullscreen";
        cakePage.innerHTML = `
          <div class="cake-title">🎂 生日蛋糕 🎂</div>
          <div class="cake-container">
            <div id="cheesecake">
              <div class="toppings"></div>
              <div class="base"></div>
              <div class="plate"></div>
              <div class="glasee"></div>
              <div class="candles">
                <div class="candle">
                  <div class="flame"></div>
                </div>
                <div class="candle">
                  <div class="flame"></div>
                </div>
                <div class="candle">
                  <div class="flame"></div>
                </div>
                <div class="candle">
                  <div class="flame"></div>
                </div>
                <div class="candle">
                  <div class="flame"></div>
                </div>
              </div>
            </div>
          </div>
          <div class="cake-buttons">
            <button class="cake-button" id="blow-candles">吹蜡烛</button>
            <button class="cake-button secondary" id="reset-all">重新开始</button>
          </div>
        `;
        document.body.appendChild(cakePage);

        // 显示蛋糕页面
        setTimeout(() => {
          cakePage.style.transform = "translateY(0)";
        }, 100);

        // 添加吹蜡烛事件
        const blowButton = cakePage.querySelector("#blow-candles");
        blowButton.addEventListener("click", () => {
          blowCandles(cakePage);
        });

        // 添加重新开始事件
        const resetButton = cakePage.querySelector("#reset-all");
        resetButton.addEventListener("click", () => {
          resetBirthdaySurprise(envelope, message, cakePage);
        });
      }

      // 吹蜡烛效果
      function blowCandles(cakePage) {
        const flames = cakePage.querySelectorAll(".flame");
        flames.forEach((flame, index) => {
          setTimeout(() => {
            flame.style.transition = "opacity 0.5s, transform 0.5s";
            flame.style.opacity = "0";
            flame.style.transform = "translateX(-50%) scale(0)";
          }, index * 100);
        });

        // 显示祝福消息
        setTimeout(() => {
          const wishMessage = document.createElement("div");
          wishMessage.style.position = "absolute";
          wishMessage.style.top = "20%";
          wishMessage.style.left = "50%";
          wishMessage.style.transform = "translateX(-50%)";
          wishMessage.style.fontSize = "24px";
          wishMessage.style.fontWeight = "bold";
          wishMessage.style.color = "#ff6b95";
          wishMessage.style.textAlign = "center";
          wishMessage.style.opacity = "0";
          wishMessage.style.transition = "opacity 1s";
          wishMessage.innerHTML = "许个愿吧！<br>愿望一定会实现的！";
          cakePage.appendChild(wishMessage);

          setTimeout(() => {
            wishMessage.style.opacity = "1";
          }, 100);
        }, flames.length * 100 + 200);
      }

      function resetBirthdaySurprise(envelope, message, cakePage = null) {
        // 先隐藏蛋糕页面（如果存在）
        if (cakePage) {
          cakePage.style.transform = "translateY(100vh)";
        }

        // 先隐藏信纸全屏
        message.style.transform = "translateY(100vh)";

        // 等待动画完成后移除元素
        setTimeout(() => {
          if (envelope) envelope.remove();
          if (message) message.remove();
          if (cakePage) cakePage.remove();

          // 重置生日惊喜状态
          birthdayTriggered = false;
          cardCounter = 0;

          // 重新开始生成卡片
          for (let i = 0; i < initialCardCount; i++) {
            setTimeout(createCard, i * (isMobile ? 60 : 40));
          }
          scheduleNextSpawn();
        }, 1200); // 与CSS过渡时间匹配
      }

      for (let i = 0; i < initialCardCount; i++) {
        setTimeout(createCard, i * (isMobile ? 60 : 40));
      }

      scheduleNextSpawn();

      document.addEventListener("visibilitychange", () => {
        if (!document.hidden) {
          scheduleNextSpawn();
        }
      });

      if (typeof pointerMediaQuery.addEventListener === "function") {
        pointerMediaQuery.addEventListener("change", syncMobileMode);
      } else if (typeof pointerMediaQuery.addListener === "function") {
        pointerMediaQuery.addListener(syncMobileMode);
      }

      window.addEventListener("resize", syncMobileMode);
    </script>
  </body>
</html>
